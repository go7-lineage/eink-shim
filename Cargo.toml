[package]
name = "eink_shim"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"                                              # lineage-24.0 Soong: build/soong rust/config/global.go RustDefaultVersion
publish = false
description = "E-Ink support shim for LineageOS port of Boox Go 7"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
libc = "=0.2.161" # Pinned to the version that Android builds (external/rust/android-crates-io/crates/libc)

# Soong ignores this table and applies its own "android" sets
[lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "deny"
unused_results = "deny"
warnings = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
arithmetic_side_effects = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
as_conversions = "deny"
multiple_unsafe_ops_per_block = "deny"
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
infinite_loop = "deny"
missing_const_for_fn = "deny"
significant_drop_tightening = "deny"
use_self = "deny"

# Device builds abort on panic and check overflow (build/soong rust/config/global.go)
[profile.release]
panic = "abort"
overflow-checks = true
